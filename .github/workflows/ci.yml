name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check
      - run: npm run build
      - run: npm test
      - name: Server smoke test
        shell: bash
        run: |
          set -e
          npm run server > /tmp/krankenhaus-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:3001/health >/dev/null; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:3001/health
          curl --fail http://127.0.0.1:3001/api/state >/dev/null
          kill $SERVER_PID
          trap - EXIT
